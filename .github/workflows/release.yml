name: Release

# Replaces every previous workflow in this repo: lint, build the Docker image
# with buildx, push it to GHCR. One pipeline, any release/v* branch.

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Cold full lint is killed silently on the 7 GB hosted runner without the
      # heap raise (quality.yml lint-guard, 2026-08-30).
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  docker:
    name: Build and push image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repo
        id: repo
        run: echo "LOWERCASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Runner stage of the Dockerfile. The default (last) stage is the CLI
          # variant; runner-base is the server image the project ships.
          target: runner-base
          push: true
          # amd64 only: a QEMU arm64 build OOM-kills the webpack step inside
          # BuildKit (12 GB heap). Add a native arm runner matrix if arm is needed.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.repo.outputs.LOWERCASE }}:${{ steps.version.outputs.VERSION }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-bun:
    name: Build and push Bun image
    needs: lint
    runs-on: ubuntu-latest
    # Bun is a best-effort runtime (AGENTS.md → Environment) and Dockerfile.bun has no
    # committed bun lockfile — `.gitignore` and `.dockerignore` both exclude `bun.lock` —
    # so `bun install` resolves fresh versions on every build and a green build is not yet
    # proven. Non-blocking on purpose: a red Bun image must never cost the node image or
    # the release itself. Drop `continue-on-error` once a run has produced a working image.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repo
        id: repo
        run: echo "LOWERCASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Bun image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.bun
          # runner-base is the Bun server image. No -web-bun variant: the last stage
          # (runner-web) bundles Chromium/Playwright and is not published.
          target: runner-base
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.repo.outputs.LOWERCASE }}:${{ steps.version.outputs.VERSION }}-bun
            ghcr.io/${{ steps.repo.outputs.LOWERCASE }}:latest-bun
          cache-from: type=gha,scope=docker-bun-base
          cache-to: type=gha,scope=docker-bun-base,mode=max
